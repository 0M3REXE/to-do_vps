include /etc/nginx/upstreams/todo.conf;

server {
  listen              [::]:80;
  listen              0.0.0.0:80;

  location ^~ /.well-known/acme-challenge {
    allow all;
    root /home/piku/.piku/acme;
  }

  listen              [::]:443 ssl http2;
  listen              0.0.0.0:443 ssl http2;
  
  ssl_certificate     /home/piku/.piku/nginx/todo.crt;
  ssl_certificate_key /home/piku/.piku/nginx/todo.key;
  server_name         todorust.duckdns.org qp90t.aiccloud.online;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/xml text/css text/javascript text/js application/x-javascript application/javascript application/json application/xml+rss application/atom+xml image/svg+xml;
  gzip_comp_level 7;
  gzip_min_length 2048;
  gzip_vary on;
  add_header X-Deployed-By "Zero-Downtime-Micro-PaaS";

  location ~ /\.git { deny all; }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  location / {
    proxy_pass http://todo_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Remote-Address $remote_addr;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-Start $msec;
  }
}
